<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindMap .MM Редактор</title>

  <!-- Шрифти та іконки -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- jsMind CSS & JS (стабільна бібліотека з нативною підтримкою .mm) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsmind@0.8.6/style/jsmind.css" />
  <script src="https://cdn.jsdelivr.net/npm/jsmind@0.8.6/es6/jsmind.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsmind@0.8.6/es6/jsmind.draggable-node.js"></script>

  <style>
    :root {
      --bg-primary: #f8fafc;
      --bg-surface: rgba(255, 255, 255, 0.92);
      --border-color: #cbd5e1;
      --text-primary: #0f172a;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
    }

    [data-theme='dark'] {
      --bg-primary: #0f172a;
      --bg-surface: rgba(30, 41, 59, 0.92);
      --border-color: #334155;
      --text-primary: #f8fafc;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
    }

    #app {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* Плаваюча панель інструментів */
    .toolbar {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-surface);
      backdrop-filter: blur(12px);
      padding: 8px 16px;
      border-radius: 40px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
      font-size: 14px;
      margin-right: 10px;
    }

    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background: transparent;
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn:hover {
      background: rgba(0, 0, 0, 0.05);
    }

    [data-theme='dark'] .btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-icon {
      padding: 6px 8px;
      border-radius: 50%;
    }

    .divider {
      width: 1px;
      height: 20px;
      background: var(--border-color);
    }

    /* Контейнер карти */
    #jsmind_container {
      width: 100%;
      height: 100%;
      background-color: var(--bg-primary);
    }

    /* Адаптація стилів вузлів під теми */
    [data-theme='dark'] jmnode {
      color: #f8fafc !important;
      background-color: #1e293b !important;
      border-color: #475569 !important;
    }

    [data-theme='dark'] jmnode.root {
      background-color: #2563eb !important;
      color: #ffffff !important;
    }

    [data-theme='dark'] jmnode.selected {
      background-color: #3b82f6 !important;
      color: #ffffff !important;
    }

    /* Підказка по центру знизу */
    .hint-bar {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      color: var(--text-primary);
      z-index: 1000;
      box-shadow: var(--shadow);
      pointer-events: none;
    }

    kbd {
      background: rgba(0, 0, 0, 0.08);
      padding: 2px 5px;
      border-radius: 4px;
      font-family: monospace;
      font-weight: 600;
    }

    [data-theme='dark'] kbd {
      background: rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Меню інструментів -->
    <header class="toolbar">
      <div class="brand">
        <span>🧠 MindMap</span>
        <span class="badge">.mm</span>
      </div>

      <button id="btn-new" class="btn" title="Створити нову карту">
        <i data-lucide="file-plus" style="width:16px;height:16px;"></i> Нова
      </button>

      <button id="btn-open" class="btn" title="Відкрити .mm файл">
        <i data-lucide="folder-open" style="width:16px;height:16px;"></i> Відкрити
      </button>

      <button id="btn-save" class="btn btn-primary" title="Зберегти .mm (Ctrl+S)">
        <i data-lucide="download" style="width:16px;height:16px;"></i> Завантажити .mm
      </button>

      <div class="divider"></div>

      <button id="btn-add-child" class="btn" title="Додати дочірній вузол (Tab)">
        <i data-lucide="corner-down-right" style="width:16px;height:16px;"></i> Дочірній
      </button>

      <button id="btn-delete" class="btn" title="Видалити вузол (Del)">
        <i data-lucide="trash-2" style="width:16px;height:16px;"></i> Видалити
      </button>

      <div class="divider"></div>

      <button id="btn-theme" class="btn btn-icon" title="Змінити тему">
        <i data-lucide="moon" style="width:16px;height:16px;"></i>
      </button>
    </header>

    <!-- Полотно для відображення ментальної карти -->
    <div id="jsmind_container"></div>

    <input type="file" id="file-input" accept=".mm,.xml" style="display: none;" />

    <div class="hint-bar">
      💡 <kbd>Подвійний клік</kbd> — редагувати текст | <kbd>Tab</kbd> — новий вузол | <kbd>Del</kbd> — видалити | <kbd>Ctrl+S</kbd> — зберегти
    </div>
  </div>

  <script>
    // 1. Початковий стан у форматі FreeMind .mm XML
    const defaultMmXml = `<?xml version="1.0" encoding="UTF-8"?>
<map version="1.0.1">
  <node ID="root" TEXT="Головна ідея">
    <node ID="node_1" TEXT="Гілка 1">
      <node ID="node_1_1" TEXT="Підпункт А"/>
      <node ID="node_1_2" TEXT="Підпункт Б"/>
    </node>
    <node ID="node_2" TEXT="Гілка 2"/>
    <node ID="node_3" TEXT="Гілка 3"/>
  </node>
</map>`;

    let currentFileName = 'mindmap.mm';

    // 2. Ініціалізація jsMind
    const options = {
      container: 'jsmind_container',
      theme: 'orange',
      editable: true,
      view: {
        engine: 'canvas',
        node_overflow: 'wrap'
      },
      shortcut: {
        enable: true,
        handles: {
          addChild: (jm) => {
            const selected = jm.get_selected_node();
            if (selected) {
              const nodeid = 'node_' + Math.random().toString(36).substring(2, 8);
              jm.add_node(selected, nodeid, 'Новий вузол');
            }
          }
        },
        mapping: {
          addchild: [9],       // Tab
          addbrother: [13],    // Enter
          editnode: [32, 113], // Пробіл або F2
          delnode: [46]        // Delete
        }
      }
    };

    const jm = new jsMind(options);

    // Завантаження збереженої або стандартної карти
    const savedXml = localStorage.getItem('jsmind_mm_cache') || defaultMmXml;
    try {
      jm.show({ meta: { name: 'MindMap' }, format: 'freemind', data: savedXml });
    } catch (e) {
      jm.show({ meta: { name: 'MindMap' }, format: 'freemind', data: defaultMmXml });
    }

    // Автозбереження в LocalStorage при змінах
    function autoSave() {
      try {
        const freemindData = jm.get_data('freemind');
        if (freemindData && freemindData.data) {
          localStorage.setItem('jsmind_mm_cache', freemindData.data);
        }
      } catch (err) {
        console.error('Помилка автозбереження:', err);
      }
    }

    // Слухаємо події для збереження
    setInterval(autoSave, 2000);

    // 3. Кнопки управління
    // Створити нову
    document.getElementById('btn-new').addEventListener('click', () => {
      if (confirm('Створити чисту карту? Незбережені зміни буде втрачено.')) {
        jm.show({ meta: { name: 'MindMap' }, format: 'freemind', data: defaultMmXml });
        localStorage.removeItem('jsmind_mm_cache');
      }
    });

    // Додати дочірній вузол
    document.getElementById('btn-add-child').addEventListener('click', () => {
      const selected = jm.get_selected_node();
      if (!selected) {
        alert('Спочатку виберіть кліком вузол, до якого хочете додати підпункт.');
        return;
      }
      const nodeid = 'node_' + Math.random().toString(36).substring(2, 8);
      jm.add_node(selected, nodeid, 'Новий вузол');
      autoSave();
    });

    // Видалити вузол
    document.getElementById('btn-delete').addEventListener('click', () => {
      const selected = jm.get_selected_node();
      if (!selected) {
        alert('Виберіть вузол для видалення.');
        return;
      }
      if (selected.isroot) {
        alert('Неможливо видалити головний корінь карти.');
        return;
      }
      jm.remove_node(selected);
      autoSave();
    });

    // Відкриття .mm файлу
    const fileInput = document.getElementById('file-input');
    document.getElementById('btn-open').addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      currentFileName = file.name;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const xmlContent = event.target.result;
          jm.show({ meta: { name: file.name }, format: 'freemind', data: xmlContent });
          autoSave();
        } catch (err) {
          alert('Не вдалося прочитати файл .mm: перевірте, чи це валідний XML.');
        }
      };
      reader.readAsText(file);
    });

    // Збереження .mm файлу
    function saveMmFile() {
      try {
        const freemindObj = jm.get_data('freemind');
        const xmlContent = freemindObj.data;
        
        const blob = new Blob([xmlContent], { type: 'application/x-freemind;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = currentFileName.endsWith('.mm') ? currentFileName : currentFileName + '.mm';
        a.click();
        URL.revokeObjectURL(url);
      } catch (err) {
        alert('Помилка збереження файлу: ' + err.message);
      }
    }

    document.getElementById('btn-save').addEventListener('click', saveMmFile);

    // Ctrl + S
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
        e.preventDefault();
        saveMmFile();
      }
    });

    // Drag and Drop
    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer.files.length > 0) {
        const file = e.dataTransfer.files[0];
        currentFileName = file.name;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            jm.show({ meta: { name: file.name }, format: 'freemind', data: ev.target.result });
            autoSave();
          } catch (err) {
            alert('Помилка відкриття перетягнутого файлу.');
          }
        };
        reader.readAsText(file);
      }
    });

    // Теми
    const themeBtn = document.getElementById('btn-theme');
    let isDark = localStorage.getItem('mm_theme_dark') === 'true';

    function updateTheme() {
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      themeBtn.innerHTML = `<i data-lucide="${isDark ? 'sun' : 'moon'}" style="width:16px;height:16px;"></i>`;
      lucide.createIcons();
      localStorage.setItem('mm_theme_dark', isDark);
    }

    themeBtn.addEventListener('click', () => {
      isDark = !isDark;
      updateTheme();
    });

    // Первинне завантаження іконок
    updateTheme();
    lucide.createIcons();
  </script>
</body>
</html>
